# Replace /var/www/agronomad with the directory containing client/dist.
# The API service is expected to listen on 127.0.0.1:4000.
server {
    listen 3000;
    server_name _;

    root /home/joa/Documents/agronomad/client/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live animal updates use a WebSocket at /ws/animals.
    # Without this block nginx answers the handshake with the SPA index.html.
    location /ws/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Allow direct navigation to React's client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
